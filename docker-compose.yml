services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "50m"
    networks:
      - home-server

  app:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "50m"
    networks:
      - home-server

volumes:
  redis_data:

networks:
  home-server:
    driver: bridge
